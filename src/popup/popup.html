<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>Pinyin Corrector</title>
</head>
<body>
  <header>
    <h1>Pinyin Corrector</h1>
    <span class="version">v0.10.3</span>
  </header>

  <label class="switch-row">
    <span>Abilitato</span>
    <input type="checkbox" id="enabled" checked />
  </label>

  <label class="switch-row">
    <span>Caratteri cinesi (hanzi)</span>
    <input type="checkbox" id="hanzi" />
  </label>

  <section class="dict">
    <h2>Dizionario</h2>
    <input type="search" id="search" placeholder="Cerca: hanzi, pinyin, inglese…" autocomplete="off" />
    <div id="results" class="results"></div>
  </section>

  <section class="stats">
    <h2>Statistiche</h2>
    <div class="stats-grid">
      <div><b id="st-corr">–</b><span>correzioni</span></div>
      <div><b id="st-ign">–</b><span>ignorati</span></div>
      <div><b id="st-acc">–</b><span>accenti</span></div>
    </div>
    <div id="st-levels" class="levels"></div>
  </section>

  <script src="../utils/dict-search.js"></script>
  <script src="popup.js"></script>
</body>
</html>
