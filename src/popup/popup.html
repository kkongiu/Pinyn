<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>Pinyin Corrector</title>
</head>
<body>
  <header>
    <h1>Pinyin Corrector</h1>
    <span class="version">v0.15.0</span>
  </header>

  <div id="support" class="support">
    <a href="https://paypal.me/kkongiu/3" target="_blank" rel="noopener" class="support-btn" title="Offrimi un caffè (3€)">☕ qǐng wǒ hē kāfēi 请我喝咖啡</a>
    <button id="support-close" title="Non mostrare più" aria-label="Chiudi">✕</button>
  </div>

  <label class="switch-row">
    <span>Abilitato</span>
    <input type="checkbox" id="enabled" checked />
  </label>

  <label class="switch-row">
    <span>Non usare in questa pagina</span>
    <input type="checkbox" id="site-blocked" disabled />
  </label>

  <label class="switch-row">
    <span>Usa solo in questa pagina</span>
    <input type="checkbox" id="site-allowed" disabled />
  </label>

  <label class="switch-row">
    <span>Caratteri cinesi (hanzi)</span>
    <input type="checkbox" id="hanzi" />
  </label>

  <label class="switch-row">
    <span>Verifica forma frase</span>
    <input type="checkbox" id="grammar" checked />
  </label>

  <label class="switch-row">
    <span>Spazio dopo suggerimento</span>
    <input type="checkbox" id="spaceAfterAccept" />
  </label>

  <label class="switch-row">
    <span>Traduzione su selezione</span>
    <input type="checkbox" id="translate" checked />
  </label>

  <section class="dict">
    <h2>Dizionario</h2>
    <input type="search" id="search" placeholder="Cerca: hanzi, pinyin, inglese…" autocomplete="off" />
    <div id="results" class="results"></div>
  </section>

  <section class="terms">
    <h2>Termini personalizzati</h2>
    <p class="hint">Aggiungi parole mancanti dal dizionario: vengono riconosciute in pagina (suggerimenti, accenti, reverse).</p>
    <div class="term-form">
      <input type="text" id="t-hanzi" placeholder="Hanzi (例：拉面)" autocomplete="off" />
      <input type="text" id="t-pinyin" placeholder="Pinyin (lā miàn / la1 mian4)" autocomplete="off" />
      <input type="text" id="t-gloss" placeholder="Traduzione" autocomplete="off" />
      <input type="text" id="t-en" placeholder="Inglese (per *reverse)" autocomplete="off" />
      <button id="t-add">Aggiungi</button>
    </div>
    <div id="t-error" class="term-error"></div>
    <ul id="t-list" class="term-list"></ul>
  </section>

  <section class="stats">
    <h2>Statistiche</h2>
    <div class="stats-grid">
      <div><b id="st-corr">–</b><span>correzioni</span></div>
      <div><b id="st-ign">–</b><span>ignorati</span></div>
      <div><b id="st-acc">–</b><span>accenti</span></div>
    </div>
    <div id="st-levels" class="levels"></div>
  </section>

  <script src="../utils/pinyin-utils.js"></script>
  <script src="../utils/custom-terms.js"></script>
  <script src="popup.js"></script>
</body>
</html>
